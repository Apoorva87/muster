[project]
name = "muster"
version = "0.1.0"
description = "Local-first durable runtime for ensembles of agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Kept out of the core install so unit tests never need the durable stack.
durable = [
    "restate-sdk[serde]>=1.0",
    "pydantic-ai>=0.0.1",
]
postgres = ["psycopg[binary]>=3.2"]
# Tracing degrades to an in-memory recorder without these, so the unit suite
# never needs them. Console/file export needs no backend; the OTLP exporter is
# only useful once someone runs Jaeger/Tempo/Grafana.
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not integration' -q"
markers = [
    "integration: requires a live Restate server and Postgres (needs Docker)",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
