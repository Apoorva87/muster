<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Muster{% endblock %}</title>
<style>
/* Inlined on purpose: the page must render with the network off. */
:root {
  --bg: #f6f6f3;
  --panel: #ffffff;
  --panel-2: #fbfbf9;
  --text: #1b1c1a;
  --muted: #6d6f6a;
  --line: #e3e3dc;
  --rail: #d9d9d0;
  --accent: #2f6f9f;
  --run: #2f6f9f;
  --ok: #2e7d4f;
  --fail: #b3352b;
  --wait: #a9741a;
  --idle: #8a8c86;
  --shadow: 0 1px 2px rgba(20, 20, 18, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a;
    --panel: #1d1f23;
    --panel-2: #23252a;
    --text: #e8e8e4;
    --muted: #9a9c98;
    --line: #2e3138;
    --rail: #363a42;
    --accent: #7ab6e8;
    --run: #7ab6e8;
    --ok: #6cc48d;
    --fail: #e8837a;
    --wait: #ddab5a;
    --idle: #7d8087;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.topbar {
  display: flex; align-items: baseline; gap: 14px;
  padding: 18px 24px; border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.brand { font-weight: 650; letter-spacing: .02em; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
.crumb { color: var(--muted); font-size: 13px; }
main { max-width: 980px; margin: 0 auto; padding: 26px 24px 64px; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
     color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow);
}
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

/* status vocabulary, shared by dots and pills */
.s-running   { --tone: var(--run); }
.s-complete  { --tone: var(--ok); }
.s-failed    { --tone: var(--fail); }
.s-rejected  { --tone: var(--idle); }
.s-pending   { --tone: var(--idle); }
.s-waiting_for_human { --tone: var(--wait); }
.pill {
  --tone: var(--idle);
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  color: var(--tone); border: 1px solid var(--tone);
  background: color-mix(in srgb, var(--tone) 10%, transparent);
  white-space: nowrap;
}
.btn {
  font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 5px 12px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
}
.btn:hover { border-color: var(--muted); }
.btn-approve { color: var(--ok); border-color: var(--ok); }
.btn-reject  { color: var(--fail); border-color: var(--fail); }
.banner {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; margin-bottom: 18px;
  border: 1px solid var(--wait); border-radius: 9px;
  background: color-mix(in srgb, var(--wait) 12%, transparent);
  color: var(--wait); font-size: 13px; font-weight: 600;
}
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">Muster<small>durable agent runtime</small></span>
  <span class="crumb">{% block crumb %}{% endblock %}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
